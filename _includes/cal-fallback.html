<script type="text/javascript">
  (function () {
    var container = document.querySelector(".cal-embed");
    var footer = document.querySelector(".cal-fallback");
    if (!container || !footer) return;

    // Watch for Cal.com injecting the iframe. When it does, clean up
    // any loader or fallback message and hide the footer.
    var observer = new MutationObserver(function () {
      if (container.querySelector("iframe")) {
        var loader = container.querySelector(".cal-loader-wrap");
        if (loader) loader.remove();
        var fallback = container.querySelector(".cal-fallback-message");
        if (fallback) fallback.remove();
        footer.hidden = true;
        observer.disconnect();
      }
    });
    observer.observe(container, { childList: true, subtree: true });

    // After 1s, if Cal.com hasn't injected an iframe yet, show the loader.
    // Skips the loader entirely on fast connections to avoid a flash.
    setTimeout(function () {
      if (!container.querySelector("iframe")) {
        container.innerHTML =
          '<div class="cal-loader-wrap">' +
          '<svg class="cal-loader" viewBox="0 0 143.49 133.08" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">' +
          '<path fill="currentColor" d="M9.4,.24h58.82V132.9H9.4c-4.96,0-8.98-4.02-8.98-8.98V9.22c0-4.96,4.02-8.98,8.98-8.98Z"/>' +
          '<path fill="currentColor" d="M143.49,66.59V9.76c0-5.26-4.26-9.53-9.53-9.53h-56.83s66.36,66.36,66.36,66.36Z"/>' +
          '<path fill="currentColor" d="M143.49,66.59h-57.28c-5.01,0-9.08,4.06-9.08,9.08v57.28l66.36-66.36Z"/>' +
          "</svg>" +
          "</div>";
      }
    }, 1000);

    // After 4s, if still no iframe, swap to the fallback message + reveal footer.
    setTimeout(function () {
      if (!container.querySelector("iframe")) {
        container.innerHTML =
          '<div class="cal-fallback-message">' +
          "<strong>It looks like your browser or network is blocking the embedded scheduler.</strong>" +
          "<p>Use the button below to schedule directly on Cal.com.</p>" +
          "</div>";
        footer.hidden = false;
      }
    }, 4000);
  })();
</script>
