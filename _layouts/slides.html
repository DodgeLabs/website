---
layout: default
---
<link rel="stylesheet" href="/assets/css/slides.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/theme/simple.min.css" id="theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark-dimmed.min.css">

<main class="container container--slides">
  <article class="card card--slides">
    <div class="reveal-wrapper">
      <div class="reveal">
        <div class="slides">
          <section data-markdown 
                   data-separator="^\r?\n---\r?\n$" 
                   data-separator-vertical="^\r?\n--\r?\n$">
            <textarea data-template>
{{ page.content }}
            </textarea>
          </section>
        </div>
      </div>
    </div>
  </article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/notes/notes.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/highlight/highlight.min.js"></script>
<script>
  Reveal.initialize({
    embedded: true,
    keyboardCondition: 'focused',
    controls: true,
    progress: true,
    center: false,
    hash: true,
    hashOneBasedIndex: true,
    width: '100%',
    height: '100%',
    margin: 0,
    minScale: 1,
    maxScale: 1,
    plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
    highlight: {
      lineNumbers: true 
    },
  });
</script>
